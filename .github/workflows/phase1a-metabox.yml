name: phase1a-metabox

on:
  push:
    branches: ["phase1a-p0-r1-corrective", "phase1a-p0-r1", "phase1a-metabox-smoke"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to test"
        required: false
        default: ""

jobs:
  project-suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record SHA
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline
      - name: Install test deps
        run: python -m pip install pytest
      - name: Full project suite
        run: python -m pytest tests -o addopts='' -q -ra

  metabox-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - name: Record SHA and provenance
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline
      - name: Install uv
        run: python -m pip install uv
      - name: Create MetaBox venv (pinned metaevobox==2.0.2 from PyPI)
        run: |
          uv venv metabox-env --python 3.11
          uv pip install --python metabox-env/Scripts/python.exe metaevobox==2.0.2
          uv pip install --python metabox-env/Scripts/python.exe pytest
          metabox-env/Scripts/python.exe -c "import metaevobox,importlib.metadata as m; print('metaevobox', m.version('metaevobox'))"
      - name: Integration + controller tests (must not all skip)
        run: |
          metabox-env/Scripts/python.exe -m pytest tests/test_p0r1_metabox_fixes.py -o addopts='' -q -ra --tb=short
      - name: Fail if all skipped
        run: |
          $out = metabox-env/Scripts/python.exe -m pytest tests/test_p0r1_metabox_fixes.py -o addopts='' -q --collect-only
          echo $out
          if ($out -match "0 collected") { exit 1 }
      - name: Smoke run
        run: metabox-env/Scripts/python.exe experiments/metabox/run_smoke.py
      - name: Upload smoke manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-smoke-manifest
          path: results/phase1a_smoke/
          if-no-files-found: ignore
