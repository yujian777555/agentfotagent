name: Phase-0-R3 independent audit

on:
  push:
    branches:
      - "audit/phase0-r3-independent-review"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact R3 candidate source
        env:
          SOURCE_SHA: "cd07249a1b4675354b01f9d5ac09ab2ffe4d2033"
        run: |
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_commit=${GITHUB_SHA}"
          } | tee audit-metadata.txt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools pytest
          python -m pip install -e .
          python --version | tee -a audit-metadata.txt
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -o addopts='' -q -ra 2>&1 | tee r3-pytest.log
      - name: Run original R2 counterexample probe
        shell: bash
        run: |
          set -o pipefail
          python tests/probe_r2_counterexamples.py 2>&1 | tee r2-counterexample-probe.log
      - name: Run extra score-schema adversarial probes
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee r3-extra-adversarial-probes.log
          import json
          from agentfotagent.evaluation.evaluator import StateBasedEvaluator
          from agentfotagent.evaluation.provenance import ReconstructionError, reconstruct_from_artifacts
          from agentfotagent.evolution.harness import BaselineHarness
          from agentfotagent.evolution.random_search import RandomSearch
          from agentfotagent.genome.schema import GenomeSpace
          from agentfotagent.tasks.generators import generate_task

          tasks = [generate_task('dial_set', 1, 'train'), generate_task('dial_set', 2, 'train')]
          task_map = {t.task_id: t for t in tasks}
          space = GenomeSpace()
          harness = BaselineHarness(tasks=tasks, space=space, config={'protocol': 'r3-independent-audit'})
          artifact = json.loads(json.dumps(harness.run_and_collect(RandomSearch(space, seed=1), 2), default=str))
          score = artifact['manifest']['scores'][0]
          original_success = score['success']
          score['success'] = int(original_success)
          try:
              reconstruct_from_artifacts(artifact, task_map, StateBasedEvaluator())
              print(f'FINDING R3-05: non-boolean success accepted: original={original_success!r}, tampered={score["success"]!r}')
          except ReconstructionError as exc:
              print(f'PASS R3-05: non-boolean success rejected: {exc}')

          artifact = json.loads(json.dumps(harness.run_and_collect(RandomSearch(space, seed=1), 2), default=str))
          artifact['manifest']['scores'][0]['unvalidated_metric'] = 999999
          try:
              reconstruct_from_artifacts(artifact, task_map, StateBasedEvaluator())
              print('FINDING R3-06: unknown extra score field accepted')
          except ReconstructionError as exc:
              print(f'PASS R3-06: unknown extra score field rejected: {exc}')
          PY
      - name: Probe key_crate location validation
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee r3-keycrate-location-probe.log
          from agentfotagent.evaluation.evaluator import StateBasedEvaluator
          from agentfotagent.tasks.generators import generate_task
          task = generate_task('key_crate', 1, 'train')
          malformed = {
              'objects': {
                  'statue': {'type': 'artifact', 'location': 'pedestal'},
                  'crate': {'type': 'crate', 'unlocked': True},
                  'pedestal': {'type': 'surface'},
              },
              'dials': {}, 'relay': {}, 'inventory': [], 'location': 'hall',
              'step': 5, 'termination_reason': 'agent_submit',
          }
          result = StateBasedEvaluator().evaluate(task, malformed, [])
          if result.success:
              print('FINDING R3-07: key_crate accepts missing crate/pedestal location fields')
          else:
              print('PASS R3-07: missing key_crate location fields rejected')
          PY
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-r3-independent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-metadata.txt
            r3-pytest.log
            r2-counterexample-probe.log
            r3-extra-adversarial-probes.log
            r3-keycrate-location-probe.log
          if-no-files-found: warn
