[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfotagent"
version = "0.1.0"
description = "Agent Evolution Sandbox (AES) — project-owned multi-step tool-use environment for Agent genotype evolution research"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
